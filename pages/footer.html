<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer</title>
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/footer.css">
    <!-- Font Awesome იკონებისთვის -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <footer class="site-footer">
       
        <div class="mailing-section">
            <h2>Join Our Mailing List</h2>
            <p class="mailing-subtitle">Be the First to Hear All the Latest Revo News</p>
            <form class="mailing-form">
                <label for="email">Email *</label>
                <input type="email" id="email" required>
                
                <div class="checkbox-box">
                    <input type="checkbox" id="sub">
                    <label for="sub">Yes, subscribe me to your newsletter. *</label>
                </div>
                
                <button type="submit">Submit</button>
            </form>
        </div>

        <div class="footer-container">
            <!-- ელ.ფოსტა -->
            <div class="footer-email">
                <a href="mailto:info@mysite.com">info@mysite.com</a>
            </div>

            <!-- სოციალური ქსელების იკონები -->
            <div class="footer-socials">
                <a href="" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="" target="_blank" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
                <a href="" target="_blank" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
            </div>

            <!-- საავტორო უფლებები -->
            <div class="footer-copy">
                <p>© 2035 by REVO. Powered and secured by <a href="" target="_blank">Wix</a></p>
            </div>
        </div>
    </footer>

</body>
</html>
